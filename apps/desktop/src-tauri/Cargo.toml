[package]
name = "lemon-tree"
version = "0.1.0"
description = "Lemon Tree desktop collaboration workspace"
authors = ["Lemon Tree"]
edition = "2021"
publish = false

[lib]
name = "lemon_tree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
